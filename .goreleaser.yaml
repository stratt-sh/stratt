# Driven by .github/workflows/release.yml.  Sigstore attestations are
# produced by the workflow's actions/attest-build-provenance step,
# not here.
version: 2

project_name: stratt

before:
  hooks:
    - go mod tidy

builds:
  - id: stratt
    main: ./cmd/stratt
    binary: stratt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: stratt
    formats: [tar.gz]
    name_template: "stratt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# Homebrew tap publishing.
#
# Homebrew tap publishing.
#
# zebpalmer/tap was the legacy tap — its last release was the 0.10.1
# transition that prompted users to migrate. That entry has been removed;
# users still on zebpalmer/tap will see the in-binary migration notice
# until they run the migration steps.
#
# Secrets required on this repo:
#   - HOMEBREW_TAP_TOKEN_STRATTSH fine-grained PAT, Contents r/w on stratt-sh/homebrew-tap

# Casks, not formulae: GoReleaser deprecated `brews` (which generated
# binary-installing formulae) in favor of `homebrew_casks`.  The post-install
# hook strips the macOS quarantine attribute so `brew install` of the
# unsigned binary just works — no Gatekeeper right-click dance.
homebrew_casks:
  - name: stratt
    repository:
      owner: stratt-sh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN_STRATTSH }}"
    homepage: "https://stratt.sh"
    description: "One set of commands for every repo, whatever language it's in — build, test, lint, release, deploy."
    binaries:
      - stratt
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/stratt"]
          end
