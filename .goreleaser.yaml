# Driven by .github/workflows/release.yml.  Sigstore attestations are
# produced by the workflow's actions/attest-build-provenance step,
# not here.
version: 2

project_name: stratt

before:
  hooks:
    - go mod tidy

builds:
  - id: stratt
    main: ./cmd/stratt
    binary: stratt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: stratt
    formats: [tar.gz]
    name_template: "stratt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# Homebrew tap publishing.
#
# Pushes to two taps during the transition period:
#   - stratt-sh/homebrew-tap  (new canonical tap)
#   - zebpalmer/homebrew-tap  (legacy, shows deprecation caveats — drop this
#                              entry once existing users have migrated)
#
# Secrets required on this repo:
#   - HOMEBREW_TAP_TOKEN        fine-grained PAT, Contents r/w on zebpalmer/homebrew-tap
#   - HOMEBREW_TAP_TOKEN_STRATTSH  fine-grained PAT, Contents r/w on stratt-sh/homebrew-tap
brews:
  - name: stratt
    repository:
      owner: stratt-sh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN_STRATTSH }}"
    homepage: "https://stratt.sh"
    description: "A polyglot task runner that replaces Makefiles, manages release versions, and handles Kustomize image bumps."
    license: Apache-2.0
    test: |
      system "#{bin}/stratt version"
    install: |
      bin.install "stratt"

  - name: stratt
    repository:
      owner: zebpalmer
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://stratt.sh"
    description: "A polyglot task runner that replaces Makefiles, manages release versions, and handles Kustomize image bumps."
    license: Apache-2.0
    caveats: |
      stratt has moved to a new tap. To migrate:

        brew untap zebpalmer/tap
        brew tap stratt-sh/tap

      The zebpalmer/tap will no longer receive updates after this release.
    test: |
      system "#{bin}/stratt version"
    install: |
      bin.install "stratt"
