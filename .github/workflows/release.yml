# Triggered by pushing a semver tag.  GoReleaser builds the cross-
# platform archives, publishes the GitHub Release, and pushes the
# Homebrew cask to stratt-sh/homebrew-tap.  Each binary gets a
# Sigstore artifact attestation — the trust anchor `stratt self update`
# verifies against.
#
# Post-publish verification lives in a separate workflow, smoke.yml,
# which installs the released cask the way a user would and asserts it
# runs and detects itself correctly.

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # OIDC for sigstore keyless signing
  attestations: write   # publish GitHub artifact attestations

# Opt in to Node 24 for JS actions ahead of the June 2026 default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for changelog

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # A tag must never publish untested binaries.  `stratt release`
      # runs this locally, but this guards direct/automated tag pushes.
      - name: Test
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with Contents: read+write on stratt-sh/homebrew-tap.
          HOMEBREW_TAP_TOKEN_STRATTSH: ${{ secrets.HOMEBREW_TAP_TOKEN_STRATTSH }}

      # Attest the release archives — the artifacts `stratt self update`
      # and the install script verify.  GoReleaser has already published
      # the release by this point, so a transient Sigstore failure here
      # would leave a published-but-unattested release (the v0.19.0-rc.2
      # incident).  Retry once, then fail the run loudly if it never lands.
      - name: Attest release binaries
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/stratt_*.tar.gz"

      - name: Attest release binaries (retry)
        if: steps.attest.outcome == 'failure'
        id: attest_retry
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/stratt_*.tar.gz"

      - name: Fail if attestation never succeeded
        if: steps.attest.outcome == 'failure' && steps.attest_retry.outcome == 'failure'
        run: |
          echo "::error::build-provenance attestation failed after retry; the release is published but unattested — cut a new tag to re-run" >&2
          exit 1
